databaseChangeLog:
  - changeSet:
      id: dml-inserts-001
      author: BrandowC
      labels: "catalog,dml,seed"
      comment: >-
        The ten products of the monolith, with the ids it issued, so every historical order line still points at a
        real product. Idempotent: an update with upsert and $setOnInsert creates what is missing and never touches
        a product that exists, so running it again cannot reset a live stock. The initial stock is the one of the
        monolith's seed; the live stock is carried over at the cutover, not here.
      changes:
        - runCommand:
            command: |
              { "update": "product", "ordered": true, "updates": [
                  {"q": {"_id": "399d2ea8-1ccb-4193-8255-1b51e331984d"}, "u": {"$setOnInsert": {"sku": "FOOD-001", "name": "Croquetas Adulto Salmón 15kg", "description": "Alimento seco balanceado para perros adultos, con salmón real como primer ingrediente.", "category": "FOOD", "price": {"$numberLong": "189000"}, "stockQuantity": {"$numberLong": "24"}, "imageUrl": "https://images.unsplash.com/photo-1589924691995-400dc9ecc119?w=600", "isActive": true, "createdAt": {"$date": "2026-10-01T00:00:00Z"}, "updatedAt": {"$date": "2026-10-01T00:00:00Z"}}}, "upsert": true},
                  {"q": {"_id": "cc1529a4-de3c-4f15-a831-b9d96586c6d9"}, "u": {"$setOnInsert": {"sku": "FOOD-002", "name": "Alimento Húmedo Gato Atún 85g", "description": "Pouch de atún en salsa para gatos adultos, alto contenido de humedad.", "category": "FOOD", "price": {"$numberLong": "8500"}, "stockQuantity": {"$numberLong": "60"}, "imageUrl": "https://images.unsplash.com/photo-1573865526739-10659fec78a5?w=600", "isActive": true, "createdAt": {"$date": "2026-10-01T00:00:00Z"}, "updatedAt": {"$date": "2026-10-01T00:00:00Z"}}}, "upsert": true},
                  {"q": {"_id": "66a99702-66b0-413f-a170-02e2df06d9c1"}, "u": {"$setOnInsert": {"sku": "ACC-001", "name": "Correa Retráctil 5m", "description": "Correa retráctil resistente para perros hasta 25kg, mango ergonómico.", "category": "ACCESSORIES", "price": {"$numberLong": "65000"}, "stockQuantity": {"$numberLong": "15"}, "imageUrl": "https://images.unsplash.com/photo-1601758228041-f3b2795255f1?w=600", "isActive": true, "createdAt": {"$date": "2026-10-01T00:00:00Z"}, "updatedAt": {"$date": "2026-10-01T00:00:00Z"}}}, "upsert": true},
                  {"q": {"_id": "5c59deae-bba3-466d-bca5-049ba3a872ba"}, "u": {"$setOnInsert": {"sku": "ACC-002", "name": "Cama Ortopédica Talla M", "description": "Cama con espuma viscoelástica, funda lavable, ideal para articulaciones.", "category": "ACCESSORIES", "price": {"$numberLong": "145000"}, "stockQuantity": {"$numberLong": "8"}, "imageUrl": "https://images.unsplash.com/photo-1601979031925-424e53b6caaa?w=600", "isActive": true, "createdAt": {"$date": "2026-10-01T00:00:00Z"}, "updatedAt": {"$date": "2026-10-01T00:00:00Z"}}}, "upsert": true},
