                  {"q": {"_id": "94dd32f1-8257-444f-bbe2-e3637e4e4d7d"}, "u": {"$setOnInsert": {"sku": "TOY-002", "name": "Rascador Torre para Gatos 90cm", "description": "Torre rascador de sisal con plataformas y casita.", "category": "TOYS", "price": {"$numberLong": "210000"}, "stockQuantity": {"$numberLong": "5"}, "imageUrl": "https://images.unsplash.com/photo-1518791841217-8f162f1e1131?w=600", "isActive": true, "createdAt": {"$date": "2026-10-01T00:00:00Z"}, "updatedAt": {"$date": "2026-10-01T00:00:00Z"}}}, "upsert": true}
