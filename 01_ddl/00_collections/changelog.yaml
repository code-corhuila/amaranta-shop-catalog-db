databaseChangeLog:
  - changeSet:
      id: ddl-collections-001
      author: BrandowC
      labels: "catalog,ddl,collections"
      comment: "product: one collection, no embedding. The structure lives in the validator, strict and erroring."
      preConditions:
        - onFail: MARK_RAN
        - not:
            - collectionExists:
                collectionName: product
      changes:
        - createCollection:
            collectionName: product
            options: |
              {
                "validator": { "$jsonSchema": {
                  "bsonType": "object",
                  "required": ["_id", "sku", "name", "description", "category", "price", "stockQuantity",
                               "imageUrl", "isActive", "createdAt", "updatedAt"],
                  "additionalProperties": false,
                  "properties": {
                    "_id":           { "bsonType": "string", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
                                       "description": "the product UUID the monolith already issued: orders point at it" },
                    "sku":           { "bsonType": "string", "minLength": 1, "maxLength": 50 },
                    "name":          { "bsonType": "string", "minLength": 1, "maxLength": 120 },
                    "description":   { "bsonType": "string", "maxLength": 500 },
                    "category":      { "enum": ["FOOD", "ACCESSORIES", "HYGIENE", "MEDICATION", "TOYS"] },
                    "price":         { "bsonType": "long", "minimum": 1, "description": "whole pesos" },
                    "stockQuantity": { "bsonType": "long", "minimum": 0, "description": "whole units; never negative" },
                    "imageUrl":      { "bsonType": "string", "maxLength": 500 },
                    "isActive":      { "bsonType": "bool" },
                    "createdAt":     { "bsonType": "date" },
                    "updatedAt":     { "bsonType": "date" }
                  } } },
                "validationLevel": "strict",
                "validationAction": "error"
              }
      rollback:
        - dropCollection:
            collectionName: product
